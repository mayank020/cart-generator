<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 60px auto;
            padding: 0 20px;
            background: #f5f5f5;
            color: #333;
        }
        h1 { margin-bottom: 24px; }
        button#btn {
            background: #2c5282;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        button#btn:hover { background: #1a365d; }
        button#btn:disabled { background: #a0aec0; cursor: not-allowed; }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #output { margin-top: 30px; display: none; }
        #output.visible { display: block; }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 2px solid #cbd5e0;
        }
        .tab-btn {
            padding: 10px 24px;
            border: none;
            background: #e2e8f0;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #4a5568;
            border-radius: 6px 6px 0 0;
            margin-right: 2px;
        }
        .tab-btn.active {
            background: white;
            color: #2c5282;
            border-bottom: 2px solid white;
            margin-bottom: -2px;
        }
        .tab-content {
            background: white;
            border: 1px solid #cbd5e0;
            border-top: none;
            border-radius: 0 0 6px 6px;
            padding: 20px;
        }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .checkout-box {
            text-align: center;
            padding: 20px 0;
        }
        .checkout-url {
            display: block;
            background: #ebf8ff;
            border: 1px solid #90cdf4;
            border-radius: 6px;
            padding: 14px 16px;
            margin: 16px 0;
            word-break: break-all;
            font-size: 14px;
            color: #2c5282;
        }
        .checkout-url a { color: #2c5282; text-decoration: underline; }
        .open-btn {
            display: inline-block;
            background: #38a169;
            color: white;
            padding: 10px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            margin-top: 8px;
        }
        .open-btn:hover { background: #2f855a; }
        .product-info { margin-bottom: 12px; color: #555; }

        pre.json {
            background: #1a202c;
            color: #68d391;
            border-radius: 6px;
            padding: 16px;
            overflow-x: auto;
            font-size: 13px;
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .error-box {
            background: #fed7d7;
            border: 1px solid #fc8181;
            border-radius: 6px;
            padding: 16px;
            margin-top: 24px;
            color: #c53030;
        }
    </style>
</head>
<body>
    <h1>Karma & Luck Cart Generator</h1>
    <button id="btn" onclick="generateCart()">Generate Cart</button>

    <div id="error" class="error-box" style="display:none;"></div>

    <div id="output">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('url')">Checkout URL</button>
            <button class="tab-btn" onclick="switchTab('request')">Complete Request</button>
            <button class="tab-btn" onclick="switchTab('response')">Complete Response</button>
            <button class="tab-btn" onclick="switchTab('headers')">Response Headers</button>
        </div>
        <div class="tab-content">
            <div id="tab-url" class="tab-panel active"></div>
            <div id="tab-request" class="tab-panel">
                <pre class="json" id="json-request"></pre>
            </div>
            <div id="tab-response" class="tab-panel">
                <pre class="json" id="json-response"></pre>
            </div>
            <div id="tab-headers" class="tab-panel">
                <pre class="json" id="json-headers"></pre>
            </div>
        </div>
    </div>

    <script>
        const QUERY = `# createCart
mutation createCart($cartInput: CartInput $countryCode: CountryCode $buyerIdentity: BuyerInput) @inContext(country: $countryCode buyer: $buyerIdentity) { cartCreate(input: $cartInput) { cart { ...Cart } userErrors { field message } warnings { code message target } } } fragment VariantFragment on ProductVariant { id title image { id url height width altText } availableForSale currentlyNotInStock quantityRule { increment maximum minimum } requiresShipping selectedOptions { name value } sku taxable price { amount currencyCode } weight availableForSale sku compareAtPrice { amount currencyCode } image { id url } unitPrice { amount currencyCode } unitPriceMeasurement { measuredType quantityUnit quantityValue referenceUnit referenceValue } selectedOptions { name value } sellingPlanAllocations(first: 50) { edges { node { priceAdjustments { compareAtPrice { amount currencyCode } perDeliveryPrice { amount currencyCode } price { amount currencyCode } unitPrice { amount currencyCode } } sellingPlan { id name options { name value } } } } } } fragment SellingPlanAllocation on SellingPlanAllocation { checkoutChargeAmount { amount currencyCode } remainingBalanceChargeAmount { amount currencyCode } priceAdjustments { compareAtPrice { amount currencyCode } perDeliveryPrice { amount currencyCode } price { amount currencyCode } unitPrice { amount currencyCode } } sellingPlan { description id name options { name value } priceAdjustments { adjustmentValue { __typename } orderCount } recurringDeliveries } } fragment LineItem on CartLine { id quantity merchandise { ... on ProductVariant { ...VariantFragment product { title handle id productType onlineStoreUrl vendor tags collections(first: 50) { edges { node { id } } } } } } attributes { key value } cost { compareAtAmountPerQuantity { amount currencyCode } amountPerQuantity { amount currencyCode } subtotalAmount { amount currencyCode } totalAmount { amount currencyCode } } discountAllocations { discountedAmount { amount currencyCode } __typename ... on CartAutomaticDiscountAllocation { title } ... on CartCodeDiscountAllocation { code } ... on CartCustomDiscountAllocation { title } } sellingPlanAllocation { ...SellingPlanAllocation } } fragment ComponentizableLineItem on ComponentizableCartLine { id quantity merchandise { ... on ProductVariant { ...VariantFragment product { title handle id productType onlineStoreUrl vendor tags collections(first: 50) { edges { node { id } } } } } } attributes { key value } cost { compareAtAmountPerQuantity { amount currencyCode } amountPerQuantity { amount currencyCode } subtotalAmount { amount currencyCode } totalAmount { amount currencyCode } } discountAllocations { discountedAmount { amount currencyCode } ... on CartAutomaticDiscountAllocation { title } ... on CartCodeDiscountAllocation { code } ... on CartCustomDiscountAllocation { title } } sellingPlanAllocation { ...SellingPlanAllocation } } fragment Cart on Cart { id createdAt updatedAt checkoutUrl note lines(first: 250) { edges { node { ...LineItem } } } componentizableLines: lines(first: 250) { edges { node { ...ComponentizableLineItem } } } buyerIdentity { email phone customer { id } countryCode deliveryAddressPreferences { ... on MailingAddress { address1 address2 city country firstName lastName phone zip province } } } cost { totalAmount { amount currencyCode } subtotalAmount { amount currencyCode } totalTaxAmount { amount currencyCode } totalDutyAmount { amount currencyCode } } discountAllocations { discountApplication { __typename allocationMethod targetSelection targetType value { ... on MoneyV2 { amount currencyCode } ... on PricingPercentageValue { percentage } } } discountedAmount { amount currencyCode } __typename ... on CartAutomaticDiscountAllocation { title } ... on CartCodeDiscountAllocation { code } ... on CartCustomDiscountAllocation { title } } cost { checkoutChargeAmount { amount currencyCode } subtotalAmount { amount currencyCode } totalAmount { amount currencyCode } totalDutyAmount { amount currencyCode } totalTaxAmount { amount currencyCode } totalTaxAmountEstimated totalDutyAmountEstimated totalAmountEstimated subtotalAmountEstimated } deliveryGroups(first: 20) { edges { node { id deliveryOptions { code deliveryMethodType description title handle estimatedCost { amount currencyCode } } groupType selectedDeliveryOption { code deliveryMethodType description title handle estimatedCost { amount currencyCode } } } } } attributes { key value } discountCodes { applicable code } attributes { key value } }`;

        const TAB_NAMES = ['url', 'request', 'response', 'headers'];

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', tab === TAB_NAMES[i]);
            });
            TAB_NAMES.forEach(name => {
                document.getElementById('tab-' + name).classList.toggle('active', tab === name);
            });
        }

        async function generateCart() {
            const btn = document.getElementById('btn');
            const output = document.getElementById('output');
            const errorBox = document.getElementById('error');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Creating cart...';
            output.classList.remove('visible');
            errorBox.style.display = 'none';

            try {
                const API_URL = 'https://checkout.karmaandluck.com/api/2025-04/graphql.json';
                const requestHeaders = {
                    'X-Shopify-Storefront-Access-Token': '3378b1e4c35d3ebaa08ccdf7cc97331e',
                    'Content-Type': 'application/json'
                };
                const requestBody = {
                    query: QUERY,
                    variables: {
                        cartInput: {
                            lines: [{
                                merchandiseId: "gid://shopify/ProductVariant/32777040920656",
                                quantity: 1,
                                attributes: [{ key: "_id", value: "f42b2e" }]
                            }],
                            buyerIdentity: {
                                countryCode: "US",
                                deliveryAddressPreferences: []
                            },
                            attributes: [{
                                key: "appbrew-instance-id",
                                value: "MPYqa4GXNMX6Azjq9nWFOxHYvFzZOg5U"
                            }]
                        },
                        countryCode: "US"
                    }
                };

                // Show the complete request
                document.getElementById('json-request').textContent = JSON.stringify({
                    method: 'POST',
                    url: API_URL,
                    headers: requestHeaders,
                    body: requestBody
                }, null, 2);

                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: requestHeaders,
                    body: JSON.stringify(requestBody)
                });

                // Capture response headers
                const headersObj = {};
                res.headers.forEach((value, key) => {
                    headersObj[key] = value;
                });
                document.getElementById('json-headers').textContent = JSON.stringify({
                    status: res.status,
                    statusText: res.statusText,
                    headers: headersObj
                }, null, 2);

                const data = await res.json();

                // Always show the full response in the response tab
                document.getElementById('json-response').textContent = JSON.stringify(data, null, 2);

                if (data.data?.cartCreate?.cart?.checkoutUrl) {
                    const cart = data.data.cartCreate.cart;
                    const checkoutUrl = cart.checkoutUrl;
                    const line = cart.lines?.edges?.[0]?.node;
                    const productTitle = line?.merchandise?.product?.title || '';
                    const price = line?.cost?.totalAmount;
                    const subtotal = cart.cost?.subtotalAmount;

                    let urlHtml = '<div class="checkout-box">';
                    if (productTitle) {
                        urlHtml += `<div class="product-info"><strong>Product:</strong> ${productTitle}</div>`;
                    }
                    if (price) {
                        urlHtml += `<div class="product-info"><strong>Total:</strong> $${price.amount} ${price.currencyCode}</div>`;
                    }
                    urlHtml += `<div class="checkout-url"><a href="${checkoutUrl}" target="_blank">${checkoutUrl}</a></div>`;
                    urlHtml += `<a class="open-btn" href="${checkoutUrl}" target="_blank">Open Checkout</a>`;
                    urlHtml += '</div>';

                    document.getElementById('tab-url').innerHTML = urlHtml;
                    output.classList.add('visible');
                    switchTab('url');
                } else {
                    // No checkout URL - show error info in URL tab, still show full response
                    const errors = data.data?.cartCreate?.userErrors || data.errors || [];
                    document.getElementById('tab-url').innerHTML =
                        '<div style="color:#c53030;padding:12px;">No checkout URL returned.<br><br><strong>Errors:</strong> '
                        + JSON.stringify(errors, null, 2) + '</div>';
                    output.classList.add('visible');
                    switchTab('response');
                }
            } catch (err) {
                errorBox.style.display = 'block';
                errorBox.innerHTML = '<strong>Request failed:</strong> ' + err.message
                    + '<br><br>If you see a CORS error, serve this page via HTTP:<br>'
                    + '<code>python3 -m http.server 8080</code> then open '
                    + '<a href="http://localhost:8080/cart-generator.html">http://localhost:8080/cart-generator.html</a>';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generate Cart';
            }
        }
    </script>
</body>
</html>
